name: Build and Release

on:
    # 正常 Release：推送 v* tag 时触发
    push:
        tags:
            - 'v*'

    # 手动触发：
    # 主要用于在 main 分支预热 WebView2 SDK cache
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref_name }}
    cancel-in-progress: false

env:
    WEBVIEW2_SDK_VERSION: '1.0.4129.50'

jobs:
    release:
        name: ${{ github.event_name == 'push' && 'Build Windows release' || 'Warm WebView2 cache' }}
        runs-on: windows-2025

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set release version
              if: github.event_name == 'push'
              shell: pwsh
              run: |
                  $tag = '${{ github.ref_name }}'

                  if ($tag -notmatch '^v(.+)$') {
                      throw "无效 Release tag：$tag"
                  }

                  $version = $Matches[1]

                  "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
                  "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  architecture: x64
                  cache: npm

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
                  architecture: x64

            - name: Restore WebView2 SDK cache
              id: webview2-cache
              uses: actions/cache@v6
              with:
                  path: .cache/webview2
                  key: ${{ runner.os }}-webview2-sdk-${{ env.WEBVIEW2_SDK_VERSION }}

            - name: Show WebView2 cache status
              shell: pwsh
              run: |
                  if ('${{ steps.webview2-cache.outputs.cache-hit }}' -eq 'true') {
                      Write-Host 'WebView2 SDK cache hit'
                  } else {
                      Write-Host 'WebView2 SDK cache miss'
                  }

            - name: Install dependencies
              if: github.event_name == 'push' || steps.webview2-cache.outputs.cache-hit != 'true'
              run: npm ci

            - name: Build native components
              if: github.event_name == 'push' || steps.webview2-cache.outputs.cache-hit != 'true'
              run: npm run build:native

            - name: Verify native addons
              if: github.event_name == 'push'
              shell: pwsh
              run: |
                  $addons = Get-ChildItem './native/bin/win-x64' -Filter '*.node'

                  if ($addons.Count -eq 0) {
                      throw '未找到任何 native addon'
                  }

                  foreach ($addon in $addons) {
                      Write-Host "Verifying $($addon.Name)..."

                      node -e "
                          const path = process.argv[1];
                          const native = require(path);
                          console.log('Loaded:', path);
                          console.log('Exports:', Object.keys(native));
                      " $addon.FullName

                      if ($LASTEXITCODE -ne 0) {
                          throw "无法加载 native addon: $($addon.Name)"
                      }
                  }

            # 会隐式执行 npm run build // TODO
            - name: Create portable package
              if: github.event_name == 'push'
              run: npm run package

            - name: Create release archives
              if: github.event_name == 'push'
              shell: pwsh
              run: |
                  $releaseDirectory = Join-Path $PWD 'dist\release'
                  New-Item -ItemType Directory -Force $releaseDirectory | Out-Null

                  $noRuntimeName = "DDCMonitorController-v$($env:RELEASE_VERSION)-noRuntime-win-x64.zip"
                  $portableName = "DDCMonitorController-v$($env:RELEASE_VERSION)-portable-win-x64.zip"

                  $noRuntimeArchive = Join-Path $releaseDirectory $noRuntimeName
                  $portableArchive = Join-Path $releaseDirectory $portableName

                  Compress-Archive `
                      -Path (Join-Path $PWD 'dist\build\*') `
                      -DestinationPath $noRuntimeArchive `
                      -CompressionLevel Optimal

                  Compress-Archive `
                      -Path (Join-Path $PWD 'dist\portable\*') `
                      -DestinationPath $portableArchive `
                      -CompressionLevel Optimal

                  "NO_RUNTIME_ARCHIVE=$noRuntimeArchive" >> $env:GITHUB_ENV
                  "PORTABLE_ARCHIVE=$portableArchive" >> $env:GITHUB_ENV

            - name: Publish GitHub Release
              if: github.event_name == 'push'
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create $env:RELEASE_TAG `
                      $env:NO_RUNTIME_ARCHIVE `
                      $env:PORTABLE_ARCHIVE `
                      --verify-tag `
                      --title "DDC Monitor Controller v$($env:RELEASE_VERSION)" `
                      --generate-notes

                  if ($LASTEXITCODE -ne 0) {
                      throw '创建 GitHub Release 失败'
                  }
