name: Build and Release

on:
    push:
        tags:
            - 'v*'

    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag，例如 v0.0.1'
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    cancel-in-progress: false

jobs:
    release:
        name: Build Windows release
        runs-on: windows-2025

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

            - name: Set release version
              shell: pwsh
              run: |
                  if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
                      $tag = '${{ inputs.tag }}'
                  } else {
                      $tag = '${{ github.ref_name }}'
                  }

                  if ($tag -notmatch '^v(.+)$') {
                      throw "无效 Release tag：$tag"
                  }

                  $version = $Matches[1]

                  "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
                  "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  architecture: x64
                  cache: npm

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
                  architecture: x64

            # @webviewjs/webview 当前存在 npm ci 安装问题，
            # 暂时使用 npm install
            - name: Install dependencies
              run: npm install

            - name: Build native components
              run: npm run build:native

            - name: Verify native addon
              shell: pwsh
              run: |
                  node -e "const native = require('./native/bin/win-x64/MonitorNative.node'); for (const name of ['refreshMonitors', 'getVcpValue', 'setVcpValue', 'startWindowDrag', 'shutdown']) { if (typeof native[name] !== 'function') throw new Error('MonitorNative.node 缺少导出：' + name); }"

            # 会隐式执行 npm run build // TODO
            - name: Create portable package
              run: npm run package

            - name: Create release archives
              shell: pwsh
              run: |
                  $releaseDirectory = Join-Path $PWD 'dist\release'
                  New-Item -ItemType Directory -Force $releaseDirectory | Out-Null

                  $noRuntimeName = "DDCMonitorController-v$($env:RELEASE_VERSION)-noRuntime-win-x64.zip"
                  $portableName = "DDCMonitorController-v$($env:RELEASE_VERSION)-portable-win-x64.zip"

                  $noRuntimeArchive = Join-Path $releaseDirectory $noRuntimeName
                  $portableArchive = Join-Path $releaseDirectory $portableName

                  Compress-Archive `
                      -Path (Join-Path $PWD 'dist\build\*') `
                      -DestinationPath $noRuntimeArchive `
                      -CompressionLevel Optimal

                  Compress-Archive `
                      -Path (Join-Path $PWD 'dist\portable\*') `
                      -DestinationPath $portableArchive `
                      -CompressionLevel Optimal

                  "NO_RUNTIME_ARCHIVE=$noRuntimeArchive" >> $env:GITHUB_ENV
                  "PORTABLE_ARCHIVE=$portableArchive" >> $env:GITHUB_ENV

            - name: Publish GitHub Release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create $env:RELEASE_TAG `
                      $env:NO_RUNTIME_ARCHIVE `
                      $env:PORTABLE_ARCHIVE `
                      --verify-tag `
                      --title "DDC Monitor Controller v$($env:RELEASE_VERSION)" `
                      --generate-notes

                  if ($LASTEXITCODE -ne 0) {
                      throw '创建 GitHub Release 失败'
                  }
